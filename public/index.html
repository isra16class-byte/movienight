<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MovieNight — Función privada</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="reel-scene">
  <div class="sprocket-strip"></div>

  <main class="ticket-booth">
    <p class="eyebrow">Función privada · solo con invitación</p>
    <h1 class="marquee-title">MOVIE<br>NIGHT</h1>
    <p class="tagline">Sube tu película, abre la sala y comparte el boleto de entrada con tus amigos.</p>

    <label class="film-drop" id="dropLabel" for="videoFile">
      <span class="film-drop-icon">🎞️</span>
      <span id="fileNameText">Elegir película</span>
      <input type="file" id="videoFile" accept="video/*" hidden>
    </label>

    <button id="createBtn" class="ticket-btn">
      <span class="ticket-btn-main">Empezar función</span>
      <span class="ticket-btn-notch"></span>
    </button>

    <div id="status" class="status-line"></div>
  </main>

  <div class="sprocket-strip"></div>
</div>

<script>
const btn = document.getElementById('createBtn');
const status = document.getElementById('status');
const fileInput = document.getElementById('videoFile');
const dropLabel = document.getElementById('dropLabel');
const fileNameText = document.getElementById('fileNameText');

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) {
    dropLabel.classList.add('has-file');
    fileNameText.textContent = file.name;
  }
});

btn.onclick = async () => {
  const file = fileInput.files[0];
  if (!file) { status.textContent = 'Elige una película primero'; return; }
  btn.disabled = true;
  status.innerHTML = '<span class="reel-spinner"></span> Subiendo tu película...';

  const form = new FormData();
  form.append('video', file);

  try {
    const res = await fetch('/create-room', { method: 'POST', body: form });
    const data = await res.json();
    if (data.error) { status.textContent = 'Error: ' + data.error; btn.disabled = false; return; }
    localStorage.setItem('mn_host_' + data.roomId, data.hostToken);
    status.innerHTML = '<span class="reel-spinner"></span> Preparando la sala...';
    window.location = `/room/${data.roomId}`;
  } catch (err) {
    status.textContent = 'No se pudo subir el archivo. Intenta de nuevo.';
    btn.disabled = false;
  }
};
</script>
</body>
</html>
