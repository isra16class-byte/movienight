<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>MovieNight — 📼</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="vhs-scene">
  <div class="horizon"><div class="sun"></div><div class="grid"></div></div>
  <div class="floaters">
    <span class="floater" style="left:2%;  font-size:48px; animation-duration:8s;  animation-delay:-1s;">📼</span>
    <span class="floater" style="left:9%;  font-size:32px; animation-duration:11s; animation-delay:-6s;">💿</span>
    <span class="floater" style="left:16%; font-size:42px; animation-duration:9.5s; animation-delay:-3s;">🎞️</span>
    <span class="floater" style="left:23%; font-size:29px; animation-duration:13s; animation-delay:-8s;">📀</span>
    <span class="floater" style="left:31%; font-size:54px; animation-duration:7s;  animation-delay:-2s;">📼</span>
    <span class="floater" style="left:38%; font-size:35px; animation-duration:10s; animation-delay:-5s;">💿</span>
    <span class="floater" style="left:45%; font-size:26px; animation-duration:12s; animation-delay:-9s;">🎞️</span>
    <span class="floater" style="left:52%; font-size:45px; animation-duration:8.5s; animation-delay:-4s;">📀</span>
    <span class="floater" style="left:59%; font-size:32px; animation-duration:9s;  animation-delay:-7s;">📼</span>
    <span class="floater" style="left:66%; font-size:50px; animation-duration:11.5s; animation-delay:-1.5s;">💿</span>
    <span class="floater" style="left:73%; font-size:29px; animation-duration:7.5s; animation-delay:-6.5s;">🎞️</span>
    <span class="floater" style="left:80%; font-size:38px; animation-duration:10.5s; animation-delay:-3.5s;">📀</span>
    <span class="floater" style="left:87%; font-size:48px; animation-duration:9s;  animation-delay:-8.5s;">📼</span>
    <span class="floater" style="left:94%; font-size:30px; animation-duration:12.5s; animation-delay:-2.5s;">💿</span>
    <span class="floater" style="left:5%;  font-size:35px; animation-duration:10s; animation-delay:-10s;">📀</span>
    <span class="floater" style="left:62%; font-size:26px; animation-duration:8s;  animation-delay:-11s;">🎞️</span>
    <span class="floater" style="left:40%; font-size:42px; animation-duration:13.5s; animation-delay:-4.5s;">📼</span>
    <span class="floater" style="left:97%; font-size:35px; animation-duration:9.5s; animation-delay:-6s;">💿</span>
  </div>

  <main class="deck">
    <span class="deck-corner tl"></span>
    <span class="deck-corner tr"></span>
    <span class="deck-corner bl"></span>
    <span class="deck-corner br"></span>
    <div class="rec-timer"><span class="rec-dot"></span> REC <span id="recTime">00:00</span></div>

    <p class="eyebrow-osd">▸ REWIND · PLAY · REC ◂</p>
    <h1 class="marquee-title">MOVIE NIGHT</h1>
    <p class="tagline">Inserta tu cinta, graba la sala y comparte el código con tus amigos.</p>

    <label class="tape-slot tracking-glitch" id="dropLabel" for="videoFile">
      <span class="tape-slot-icon">📼</span>
      <span id="fileNameText">Insertar cinta</span>
      <input type="file" id="videoFile" accept="video/*" hidden>
    </label>

    <input type="password" id="roomPassword" class="password-input" placeholder="Contraseña de la sala (opcional)" maxlength="60">

    <button id="createBtn" class="rec-btn tracking-glitch">
      <span class="rec-dot"></span>
      <span>GRABAR SALA</span>
    </button>

    <div id="status" class="status-line"></div>
    <div class="tape-progress" id="progressWrap"><div class="tape-progress-bar" id="progressBar"></div></div>

    <div class="divider-row"><span>o también</span></div>

    <p class="eyebrow-osd" style="color:var(--pink); margin-bottom:10px;">¿Ya tienes un código?</p>
    <div class="join-row tracking-glitch">
      <input type="text" id="joinCode" placeholder="a1b2c3" maxlength="6">
      <button class="join-btn" id="joinBtn">▶ ENTRAR</button>
    </div>
    <div id="joinStatus" class="status-line"></div>

    <a href="/library.html" class="back-link" style="display:block; margin-top:18px; text-align:center;">📼 Ver biblioteca de cintas subidas</a>
  </main>
</div>

<script>
const btn = document.getElementById('createBtn');
const status = document.getElementById('status');
const fileInput = document.getElementById('videoFile');
const dropLabel = document.getElementById('dropLabel');
const fileNameText = document.getElementById('fileNameText');
const progressWrap = document.getElementById('progressWrap');
const progressBar = document.getElementById('progressBar');

const cassetteIcon = `<svg class="cassette-spin" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="color:var(--cyan)">
  <circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2" stroke-dasharray="4 3"/>
  <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
</svg>`;

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) {
    dropLabel.classList.add('has-file');
    fileNameText.textContent = file.name;
  }
});

btn.onclick = () => {
  const file = fileInput.files[0];
  if (!file) { status.textContent = 'Inserta una cinta primero'; return; }
  btn.disabled = true;
  btn.querySelector('span:last-child').textContent = 'GRABANDO...';
  progressWrap.classList.add('active');
  status.innerHTML = `${cassetteIcon} Subiendo cinta... 0%`;

  const form = new FormData();
  form.append('video', file);
  form.append('password', document.getElementById('roomPassword').value.trim());

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/create-room');

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable) {
      const pct = Math.round((e.loaded / e.total) * 100);
      progressBar.style.width = pct + '%';
      status.innerHTML = `${cassetteIcon} Subiendo cinta... ${pct}%`;
    }
  };

  xhr.onload = () => {
    let data;
    try { data = JSON.parse(xhr.responseText); } catch { data = { error: 'Respuesta inválida del servidor' }; }
    if (xhr.status < 200 || xhr.status >= 300 || data.error) {
      status.textContent = 'Error: ' + (data.error || 'no se pudo crear la sala');
      btn.disabled = false;
      btn.querySelector('span:last-child').textContent = 'GRABAR SALA';
      progressWrap.classList.remove('active');
      return;
    }
    localStorage.setItem('mn_host_' + data.roomId, data.hostToken);
    progressBar.style.width = '100%';
    status.innerHTML = `${cassetteIcon} Preparando la sala...`;
    window.location = `/room/${data.roomId}`;
  };

  xhr.onerror = () => {
    status.textContent = 'No se pudo subir el archivo. Intenta de nuevo.';
    btn.disabled = false;
    btn.querySelector('span:last-child').textContent = 'GRABAR SALA';
    progressWrap.classList.remove('active');
  };

  xhr.send(form);
};

// --- Unirse a sala con código ---
const joinBtn = document.getElementById('joinBtn');
const joinCode = document.getElementById('joinCode');
const joinStatus = document.getElementById('joinStatus');

async function tryJoin() {
  const code = joinCode.value.trim().toLowerCase();
  if (!code) { joinStatus.textContent = 'Escribe un código de sala'; return; }
  joinBtn.disabled = true;
  joinStatus.innerHTML = `${cassetteIcon} Buscando sala...`;
  try {
    const res = await fetch(`/api/room/${code}`);
    const data = await res.json();
    if (data.error) {
      joinStatus.textContent = 'Esa sala no existe. Revisa el código.';
      joinBtn.disabled = false;
      return;
    }
    window.location = `/room/${code}`;
  } catch (err) {
    joinStatus.textContent = 'Error al buscar la sala. Intenta de nuevo.';
    joinBtn.disabled = false;
  }
}

joinBtn.onclick = tryJoin;
joinCode.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryJoin(); });

// --- Contador REC decorativo (ambiente, no tiene efecto funcional) ---
let recSeconds = 0;
const recTimeEl = document.getElementById('recTime');
setInterval(() => {
  recSeconds++;
  const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
  const s = String(recSeconds % 60).padStart(2, '0');
  recTimeEl.textContent = `${m}:${s}`;
}, 1000);
</script>
</body>
</html>
