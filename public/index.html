<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>MovieNight — 📼</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#170b27">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MovieNight">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/js/sw-register.js"></script>
</head>
<body>
<div class="vhs-scene">
  <div class="horizon"><div class="sun"></div><div class="grid"></div></div>
  <div class="floaters floaters-index">
    <span class="floater">📼</span>
    <span class="floater">💿</span>
    <span class="floater">🎞️</span>
    <span class="floater">📀</span>
    <span class="floater">📼</span>
    <span class="floater">💿</span>
    <span class="floater">🎞️</span>
    <span class="floater">📀</span>
    <span class="floater">📼</span>
    <span class="floater">💿</span>
    <span class="floater">🎞️</span>
    <span class="floater">📀</span>
    <span class="floater">📼</span>
    <span class="floater">💿</span>
    <span class="floater">📀</span>
    <span class="floater">🎞️</span>
    <span class="floater">📼</span>
    <span class="floater">💿</span>
  </div>

  <main class="deck">
    <span class="deck-corner tl"></span>
    <span class="deck-corner tr"></span>
    <span class="deck-corner bl"></span>
    <span class="deck-corner br"></span>
    <div class="rec-timer"><span class="rec-dot"></span> REC <span id="recTime">00:00</span></div>

    <div class="account-bar" id="accountBar"></div>

    <p class="eyebrow-osd">▸ REWIND · PLAY · REC ◂</p>
    <h1 class="marquee-title">MOVIE NIGHT</h1>
    <p class="tagline">Inserta tu cinta, graba la sala y comparte el código con tus amigos.</p>

    <label class="tape-slot tracking-glitch" id="dropLabel" for="videoFile">
      <span class="tape-slot-icon">📼</span>
      <span id="fileNameText">Insertar cinta</span>
      <input type="file" id="videoFile" accept="video/*" hidden>
    </label>

    <input type="password" id="roomPassword" class="password-input" placeholder="Contraseña de la sala (opcional)" maxlength="60" autocomplete="new-password">

    <button id="createBtn" class="rec-btn tracking-glitch">
      <span class="rec-dot"></span>
      <span>GRABAR SALA</span>
    </button>

    <div id="status" class="status-line"></div>
    <div class="tape-progress" id="progressWrap"><div class="tape-progress-bar" id="progressBar"></div></div>

    <div class="divider-row"><span>o también</span></div>

    <p class="eyebrow-osd eyebrow-code">¿Ya tienes un código?</p>
    <div class="join-row tracking-glitch">
      <div id="joinCode" class="join-code-field" contenteditable="true" data-placeholder="a1b2c3" role="textbox" aria-multiline="false" enterkeyhint="go" autocapitalize="off" spellcheck="false"></div>
      <button class="join-btn" id="joinBtn">▶ ENTRAR</button>
    </div>
    <div id="joinStatus" class="status-line"></div>

    <a href="/library.html" class="back-link back-link-below-12">📼 Ver biblioteca de cintas subidas</a>
  </main>
</div>

<!-- Modal genérico: reemplaza prompt()/confirm()/alert() nativos (mismo componente que room.html/
     library.html — ver nota junto a .mn-modal-overlay en style.css). Se suma acá recién en V19, para
     pedir la contraseña de subida antes de mandar el video a /create-room. -->
<div class="mn-modal-overlay" id="mnModalOverlay" hidden>
  <div class="mn-modal" role="dialog" aria-modal="true" aria-labelledby="mnModalTitle">
    <p class="mn-modal-title" id="mnModalTitle"></p>
    <p class="mn-modal-message" id="mnModalMessage" hidden></p>
    <input class="mn-modal-input" id="mnModalInput" hidden autocomplete="off">
    <p class="mn-modal-error" id="mnModalError" hidden></p>
    <div class="mn-modal-actions">
      <button class="mn-modal-btn mn-modal-cancel" id="mnModalCancel">Cancelar</button>
      <button class="mn-modal-btn mn-modal-ok" id="mnModalOk">Aceptar</button>
    </div>
  </div>
</div>

<script src="/js/index.js" defer></script>
</body>
</html>
