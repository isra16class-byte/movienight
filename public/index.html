<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MovieNight 🎬</title>
<style>
  body { background:#0d0d14; color:#eee; font-family: 'Segoe UI', sans-serif; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .card { background:#16161f; padding:40px; border-radius:16px; width:360px; box-shadow:0 0 40px rgba(255,0,120,0.15); text-align:center; }
  h1 { margin-top:0; font-size:28px; }
  input[type=file] { width:100%; margin:20px 0; color:#ccc; }
  button { background:#ff2e88; color:white; border:none; padding:12px 20px; border-radius:8px; font-size:16px; cursor:pointer; width:100%; }
  button:disabled { background:#555; }
  #status { margin-top:15px; font-size:14px; color:#aaa; }
  #result { margin-top:20px; word-break:break-all; }
  a { color:#ff2e88; }
</style>
</head>
<body>
<div class="card">
  <h1>🎬 MovieNight</h1>
  <p>Sube tu película y comparte el link con tus amigos.</p>
  <input type="file" id="videoFile" accept="video/*">
  <button id="createBtn">Crear sala</button>
  <div id="status"></div>
  <div id="result"></div>
</div>
<script>
const btn = document.getElementById('createBtn');
const status = document.getElementById('status');
const result = document.getElementById('result');

btn.onclick = async () => {
  const file = document.getElementById('videoFile').files[0];
  if (!file) return alert('Elige un video primero');
  btn.disabled = true;
  status.textContent = 'Subiendo... esto puede tardar según el tamaño del archivo';

  const form = new FormData();
  form.append('video', file);

  const res = await fetch('/create-room', { method: 'POST', body: form });
  const data = await res.json();
  btn.disabled = false;

  if (data.error) { status.textContent = 'Error: ' + data.error; return; }

  localStorage.setItem('mn_host_' + data.roomId, data.hostToken);
  window.location = `/room/${data.roomId}`;
};
</script>
</body>
</html>
