<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>MovieNight — Nueva contraseña 📼</title>
<meta name="theme-color" content="#170b27">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="vhs-scene">
  <div class="horizon"><div class="sun"></div><div class="grid"></div></div>

  <main class="deck">
    <span class="deck-corner tl"></span>
    <span class="deck-corner tr"></span>
    <span class="deck-corner bl"></span>
    <span class="deck-corner br"></span>

    <p class="eyebrow-osd">▸ REWIND · PLAY · REC ◂</p>
    <h1 class="marquee-title" style="font-size:clamp(22px, 5vw, 30px);">NUEVA CONTRASEÑA</h1>
    <p class="tagline" id="tagline">Elegí una contraseña nueva para tu cuenta.</p>

    <div id="formWrap">
      <input type="password" id="newPassword" class="password-input" placeholder="Contraseña nueva (mínimo 8 caracteres)" autocomplete="new-password">
      <input type="password" id="confirmPassword" class="password-input" placeholder="Repetí la contraseña nueva" autocomplete="new-password">
      <button id="submitBtn" class="rec-btn tracking-glitch">
        <span class="rec-dot"></span>
        <span>GUARDAR CONTRASEÑA</span>
      </button>
    </div>

    <div id="status" class="status-line"></div>

    <a href="/" class="back-link" style="display:block; margin-top:16px; text-align:center;">◂ Volver al inicio</a>
  </main>
</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const tagline = document.getElementById('tagline');
const formWrap = document.getElementById('formWrap');
const status = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');
const newPassword = document.getElementById('newPassword');
const confirmPassword = document.getElementById('confirmPassword');

if (!token) {
  tagline.textContent = 'Este link no trae ningún token — pedí uno nuevo desde la pantalla de inicio de sesión.';
  formWrap.style.display = 'none';
}

async function submitReset() {
  const pw = newPassword.value;
  const pw2 = confirmPassword.value;
  if (pw.length < 8) { status.textContent = 'La contraseña necesita al menos 8 caracteres.'; return; }
  if (pw !== pw2) { status.textContent = 'Las dos contraseñas no coinciden.'; return; }

  submitBtn.disabled = true;
  status.textContent = 'Guardando...';
  try {
    const res = await fetch('/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: pw })
    });
    const data = await res.json();
    if (data.error) {
      status.textContent = 'Error: ' + data.error;
      submitBtn.disabled = false;
      return;
    }
    formWrap.style.display = 'none';
    tagline.textContent = 'Listo — ya podés iniciar sesión con tu contraseña nueva.';
    status.textContent = '';
  } catch (err) {
    status.textContent = 'No se pudo conectar con el servidor. Intentá de nuevo.';
    submitBtn.disabled = false;
  }
}

submitBtn.onclick = submitReset;
confirmPassword.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitReset(); });
</script>
</body>
</html>
