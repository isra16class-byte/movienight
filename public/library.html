<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>MovieNight — Biblioteca 📼</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#170b27">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MovieNight">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/js/sw-register.js"></script>
</head>
<body>
<div class="vhs-scene">
  <div class="horizon"><div class="sun"></div><div class="grid"></div></div>
  <div class="floaters floaters-vhs">
    <span class="floater">📼</span>
    <span class="floater">💿</span>
    <span class="floater">📀</span>
    <span class="floater">🎞️</span>
    <span class="floater">🎞️</span>
    <span class="floater">📼</span>
  </div>

  <main class="deck deck-wide">
    <span class="deck-corner tl"></span>
    <span class="deck-corner tr"></span>
    <span class="deck-corner bl"></span>
    <span class="deck-corner br"></span>
    <div class="rec-timer"><span class="rec-dot"></span> REC <span id="recTime">00:00</span></div>

    <div class="account-bar" id="accountBar"></div>

    <a href="/" class="back-link" id="backLink">◂ Volver</a>
    <p class="eyebrow-osd">▸ REWIND · PLAY · REC ◂</p>
    <h1 class="marquee-title marquee-title-library" id="libTitle">BIBLIOTECA DE CINTAS</h1>
    <p class="tagline" id="libTagline">Videos ya subidos en este servidor. Usa uno para crear una sala sin volver a subirlo.</p>

    <div class="new-upload hidden-by-default" id="newUploadWrap">
      <label class="tape-slot tracking-glitch" for="newTapeFile">
        <span class="tape-slot-icon">📼</span>
        <span id="newTapeFileName">O inserta una cinta nueva para esta sala</span>
        <input type="file" id="newTapeFile" accept="video/*" hidden>
      </label>
      <div class="tape-progress" id="newTapeProgressWrap"><div class="tape-progress-bar" id="newTapeProgressBar"></div></div>
      <div id="newTapeStatus" class="status-line"></div>
    </div>

    <ul class="tape-list" id="tapeList">
      <li class="library-loading">Cargando cintas...</li>
    </ul>
  </main>
</div>

<!-- Modal genérico: reemplaza prompt()/confirm()/alert() nativos (ver mnDialog en el script) -->
<div class="mn-modal-overlay" id="mnModalOverlay" hidden>
  <div class="mn-modal" role="dialog" aria-modal="true" aria-labelledby="mnModalTitle">
    <p class="mn-modal-title" id="mnModalTitle"></p>
    <p class="mn-modal-message" id="mnModalMessage" hidden></p>
    <input class="mn-modal-input" id="mnModalInput" hidden autocomplete="off">
    <p class="mn-modal-error" id="mnModalError" hidden></p>
    <div class="mn-modal-actions">
      <button class="mn-modal-btn mn-modal-cancel" id="mnModalCancel">Cancelar</button>
      <button class="mn-modal-btn mn-modal-ok" id="mnModalOk">Aceptar</button>
    </div>
  </div>
</div>

<script src="/js/escape-html.js" defer></script>
<script src="/js/library.js" defer></script>
</body>
</html>
