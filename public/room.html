<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>MovieNight — Sala</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#170b27">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MovieNight">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>
<script src="/js/sw-register.js"></script>
</head>
<body>
<div class="room-scene">
  <div class="screen-row">
    <div class="main">
      <div class="screen-wrap">
        <div class="viewers-badge" id="viewers">👥 0</div>
        <div class="host-badge hidden-by-default" id="hostBadge">🎛 CONTROL REMOTO</div>
        <div class="fs-emoji" id="fsEmoji">
          <button class="fs-emoji-toggle" id="fsEmojiToggle" title="Reacciones" aria-label="Reacciones">😊</button>
          <div class="fs-emoji-panel" id="fsEmojiPanel"></div>
        </div>
        <video id="player" playsinline webkit-playsinline disablepictureinpicture></video>
        <div class="danmaku-layer" id="danmakuLayer" aria-hidden="true"></div>
        <div class="host-controls hidden-by-default" id="hostControlsWrap">
          <button id="playPauseBtn" class="play-pause-btn" title="Reproducir / Pausar">
            <span id="playPauseIcon">▶</span>
          </button>
          <button id="skipBackBtn" class="skip-btn" title="Retroceder 10s"><span class="skip-icon">↺</span><span class="skip-label">10</span></button>
          <div class="seek-bar" id="seekBar">
            <div class="seek-track">
              <div class="seek-buffered" id="seekBuffered"></div>
              <div class="seek-fill" id="seekFill"></div>
              <div class="seek-thumb" id="seekThumb"></div>
            </div>
          </div>
          <span class="time-label" id="timeLabel">0:00 / 0:00</span>
          <button id="skipFwdBtn" class="skip-btn" title="Adelantar 10s"><span class="skip-icon">↻</span><span class="skip-label">10</span></button>
          <button id="hostFsBtn" class="skip-btn" title="Pantalla completa"><span class="skip-icon">⛶</span><span class="skip-label">FULL</span></button>
        </div>
        <div class="local-controls hidden-by-default" id="localControls">
          <!-- Solo lectura: los invitados ven cuánto dura la peli y por dónde va, pero no pueden
               tocar la barra (sin thumb arrastrable, sin listeners de mouse/touch, ver room.html) -->
          <div class="seek-bar seek-bar--readonly" id="guestSeekBar">
            <div class="seek-track">
              <div class="seek-buffered" id="guestSeekBuffered"></div>
              <div class="seek-fill" id="guestSeekFill"></div>
            </div>
          </div>
          <span class="time-label" id="guestTimeLabel">0:00 / 0:00</span>
          <div class="vol-control" id="volControl">
            <button id="volToggleBtn" title="Volumen">🔊</button>
            <input type="range" id="volSlider" class="vol-slider" min="0" max="1" step="0.05" value="1">
          </div>
          <button id="fsBtn" title="Pantalla completa">⛶</button>
        </div>
        <div class="muted-banner hidden-by-default" id="mutedBanner">🔇 Te silenciaron el chat</div>
        <div class="restart-banner hidden-by-default" id="restartBanner">🔄 El servidor se está reiniciando — la conexión se corta unos segundos y vuelve sola</div>
      </div>
    </div>

    <div class="side">
      <div class="floaters floaters-room">
        <span class="floater">📼</span>
        <span class="floater">🎞️</span>
        <span class="floater">💿</span>
        <span class="floater">📀</span>
        <span class="floater">📼</span>
        <span class="floater">🎞️</span>
      </div>
      <div class="side-header" id="sideHeaderDesktop">
        <div class="code-salir-group" id="codeSalirGroup">
          <div class="osd-counter">
            <span class="rec-dot"></span>
            <span class="osd-counter-code" id="roomCodeText"></span>
            <button class="osd-counter-copy" id="copyBtn" title="Copiar link">COPIAR</button>
          </div>
          <div class="side-actions">
            <button class="leave-btn" id="leaveBtn"><span class="leave-btn-icon">🚪</span> Salir</button>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button class="active" data-tab="chat">Chat</button>
        <button data-tab="people">Sala</button>
      </div>

      <div class="panel active" id="panel-chat">
        <div id="messages"></div>
        <div class="typing-indicator" id="typingIndicator"></div>
        <div class="reactions">
          <button data-e="😂">😂</button>
          <button data-e="😭">😭</button>
          <button data-e="😍">😍</button>
          <button data-e="😱">😱</button>
          <button data-e="🔥">🔥</button>
          <button data-e="❤️">❤️</button>
          <button data-e="👍">👍</button>
          <button data-e="👏">👏</button>
          <button data-e="🙌">🙌</button>
          <button data-e="💀">💀</button>
          <button data-e="🎉">🎉</button>
          <button data-e="😅">😅</button>
          <button data-e="😠">😠</button>
          <button data-e="😴">😴</button>
        </div>
        <div id="replyPreview">
          <span class="reply-preview-bar"></span>
          <span class="reply-preview-text" id="replyPreviewText"></span>
          <button class="reply-preview-cancel" id="replyPreviewCancel" title="Cancelar respuesta" aria-label="Cancelar respuesta">✕</button>
        </div>
        <div class="chat-input">
          <div id="chatInput" class="chat-input-field" contenteditable="true" data-placeholder="Escribe algo..." role="textbox" aria-multiline="false" enterkeyhint="send"></div>
          <button id="chatSendBtn" class="chat-send-btn" title="Enviar" aria-label="Enviar mensaje">➤</button>
        </div>
      </div>

      <div class="panel" id="panel-people">
        <!-- En celular, el código de sala y el botón Salir se mudan acá (ver JS más abajo) para
             que la pestaña Chat quede libre y el chat sea más visible mientras se ve la peli.
             En PC se quedan arriba de las pestañas, tal como estaban. -->
        <div class="side-header" id="codeSalirSlotMobile"></div>
        <div id="viewerList"></div>
        <div class="host-panel hidden-by-default" id="hostPanelWrap">
          <a class="change-video-link" id="changeVideoLink" href="#">📼 Cambiar cinta</a>
          <div class="subtitle-upload">
            <label for="subtitleFile">🗣️ Subir subtítulos (.srt)</label>
            <input type="file" id="subtitleFile" accept=".srt,.vtt">
          </div>
          <div id="subtitleStatus" class="subtitle-status"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal genérico: reemplaza prompt()/confirm()/alert() nativos (ver mnDialog en el script) -->
<div class="mn-modal-overlay" id="mnModalOverlay" hidden>
  <div class="mn-modal" role="dialog" aria-modal="true" aria-labelledby="mnModalTitle">
    <p class="mn-modal-title" id="mnModalTitle"></p>
    <p class="mn-modal-message" id="mnModalMessage" hidden></p>
    <input class="mn-modal-input" id="mnModalInput" hidden autocomplete="off">
    <p class="mn-modal-error" id="mnModalError" hidden></p>
    <div class="mn-modal-actions">
      <button class="mn-modal-btn mn-modal-cancel" id="mnModalCancel">Cancelar</button>
      <button class="mn-modal-btn mn-modal-ok" id="mnModalOk">Aceptar</button>
    </div>
  </div>
</div>

<script src="/js/escape-html.js" defer></script>
<script src="/js/room.js" defer></script>
</body>
</html>
