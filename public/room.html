<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MovieNight — Sala</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Space+Grotesk:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div class="room-scene">
  <div class="screen-row">
    <div class="main">
      <div class="screen-wrap">
        <div class="viewers-badge" id="viewers">👥 0</div>
        <div class="host-badge" id="hostBadge" style="display:none;">🎛 CONTROL REMOTO</div>
        <video id="player" playsinline webkit-playsinline disablepictureinpicture></video>
        <div class="local-controls" id="localControls" style="display:none;">
          <span>🔊</span>
          <input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
          <button id="fsBtn" title="Pantalla completa">⛶</button>
        </div>
        <div class="muted-banner" id="mutedBanner" style="display:none;">🔇 Te silenciaron el chat</div>
      </div>
    </div>

    <div class="side">
      <div class="floaters">
        <span class="floater" style="left:6%;  font-size:18px; animation-duration:9s;  animation-delay:-2s;">📼</span>
        <span class="floater" style="left:22%; font-size:14px; animation-duration:11s; animation-delay:-5s;">🎞️</span>
        <span class="floater" style="left:40%; font-size:20px; animation-duration:8s;  animation-delay:-7s;">💿</span>
        <span class="floater" style="left:58%; font-size:15px; animation-duration:10s; animation-delay:-3s;">📀</span>
        <span class="floater" style="left:75%; font-size:18px; animation-duration:12s; animation-delay:-6s;">📼</span>
        <span class="floater" style="left:90%; font-size:16px; animation-duration:9.5s; animation-delay:-1s;">🎞️</span>
      </div>
      <div class="side-header">
        <div class="osd-counter">
          <span class="rec-dot"></span>
          <span class="osd-counter-code" id="roomCodeText"></span>
          <button class="osd-counter-copy" id="copyBtn" title="Copiar link">COPIAR</button>
        </div>
      </div>

      <div class="tabs">
        <button class="active" data-tab="chat">Chat</button>
        <button data-tab="people">Sala</button>
      </div>

      <div class="panel active" id="panel-chat">
        <div id="messages"></div>
        <div class="reactions">
          <button data-e="😂">😂</button>
          <button data-e="🔥">🔥</button>
          <button data-e="😱">😱</button>
          <button data-e="❤️">❤️</button>
          <button data-e="👏">👏</button>
        </div>
        <div class="chat-input">
          <input id="chatInput" placeholder="Escribe algo...">
        </div>
      </div>

      <div class="panel" id="panel-people">
        <div id="viewerList"></div>
        <div class="change-video" id="changeVideoWrap" style="display:none;">
          <label for="newVideo">📼 Cambiar cinta</label>
          <input type="file" id="newVideo" accept="video/*">
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const roomId = location.pathname.split('/').pop();
const username = prompt('¿Cómo te llamas?') || 'Anónimo';
const hostToken = localStorage.getItem('mn_host_' + roomId) || null;
const socket = io();
const player = document.getElementById('player');
let isHost = false;
let ignoreSync = false;
let myId = null;
let lastKnownTime = 0;

document.getElementById('roomCodeText').textContent = roomId;
document.getElementById('copyBtn').onclick = () => {
  navigator.clipboard.writeText(location.href);
  const btn = document.getElementById('copyBtn');
  const original = btn.textContent;
  btn.textContent = 'LISTO';
  setTimeout(() => btn.textContent = original, 1500);
};

fetch(`/api/room/${roomId}`).then(r => r.json()).then(data => {
  if (data.error) { alert('Sala no encontrada'); return; }
  player.src = data.videoFile;
});

socket.on('connect', () => { myId = socket.id; });
socket.emit('join-room', { roomId, username, hostToken });
socket.on('room-error', msg => { alert(msg); location.href = '/'; });

socket.on('host-status', (host) => {
  isHost = host;
  player.controls = isHost;
  document.getElementById('hostBadge').style.display = isHost ? 'block' : 'none';
  document.getElementById('localControls').style.display = isHost ? 'none' : 'flex';
  document.getElementById('changeVideoWrap').style.display = isHost ? 'block' : 'none';
});

socket.on('viewer-count', n => document.getElementById('viewers').textContent = `👥 ${n}`);

socket.on('kicked', () => { alert('Te expulsaron de la sala 🚪'); location.href = '/'; });
socket.on('mute-status', ({ muted }) => {
  document.getElementById('mutedBanner').style.display = muted ? 'block' : 'none';
  document.getElementById('chatInput').disabled = muted;
});

// --- Lista de espectadores (solo el host ve botones) ---
socket.on('viewer-list', (list) => {
  const el = document.getElementById('viewerList');
  el.innerHTML = '';
  list.forEach(v => {
    const row = document.createElement('div');
    row.className = 'viewer-item';
    let actions = '';
    if (isHost && v.id !== myId && !v.isHost) {
      actions = `<span class="actions">
        <button class="mute" data-id="${v.id}">${v.muted ? 'Desilenciar' : 'Silenciar'}</button>
        <button class="kick" data-id="${v.id}">Expulsar</button>
      </span>`;
    }
    row.innerHTML = `<span>${v.isHost ? '🎛 ' : ''}${v.username}${v.muted ? ' 🔇' : ''}</span>${actions}`;
    el.appendChild(row);
  });
  el.querySelectorAll('.mute').forEach(b => b.onclick = () => socket.emit('toggle-mute', b.dataset.id));
  el.querySelectorAll('.kick').forEach(b => b.onclick = () => { if (confirm('¿Expulsar a este usuario?')) socket.emit('kick-user', b.dataset.id); });
});

// --- Tabs ---
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  };
});

// --- Sincronización (solo se emite si soy host) ---
player.addEventListener('play', () => { if (isHost && !ignoreSync) socket.emit('sync', { type: 'play', time: player.currentTime }); });
player.addEventListener('pause', () => { if (isHost && !ignoreSync) socket.emit('sync', { type: 'pause', time: player.currentTime }); });
player.addEventListener('seeked', () => { if (isHost && !ignoreSync) socket.emit('sync', { type: 'seek', time: player.currentTime }); });

socket.on('sync', (data) => {
  if (data.type === 'heartbeat') {
    if (Math.abs(player.currentTime - data.time) > 1.5) {
      ignoreSync = true;
      player.currentTime = data.time;
      setTimeout(() => ignoreSync = false, 300);
    }
    if (data.paused && !player.paused) { ignoreSync = true; player.pause(); setTimeout(() => ignoreSync = false, 300); }
    if (!data.paused && player.paused) { ignoreSync = true; player.play(); setTimeout(() => ignoreSync = false, 300); }
    lastKnownTime = data.time;
    return;
  }
  ignoreSync = true;
  if (Math.abs(player.currentTime - data.time) > 1) player.currentTime = data.time;
  if (data.type === 'play') player.play();
  if (data.type === 'pause') player.pause();
  lastKnownTime = data.time;
  setTimeout(() => ignoreSync = false, 300);
});

// El host manda su posición cada 4s para corregir cualquier desvío
setInterval(() => {
  if (isHost) socket.emit('sync', { type: 'heartbeat', time: player.currentTime, paused: player.paused });
}, 4000);

// Bloquea cualquier intento de adelantar/atrasar manual en los no-host
player.addEventListener('timeupdate', () => {
  if (!isHost && !ignoreSync) lastKnownTime = player.currentTime;
});
player.addEventListener('seeking', () => {
  if (!isHost && !ignoreSync) {
    ignoreSync = true;
    player.currentTime = lastKnownTime;
    setTimeout(() => ignoreSync = false, 200);
  }
});

socket.on('video-changed', ({ videoFile }) => {
  player.src = videoFile;
  player.load();
});

// --- Controles locales (no-host): volumen y pantalla completa ---
document.getElementById('volSlider').addEventListener('input', (e) => player.volume = e.target.value);
document.getElementById('fsBtn').onclick = () => player.requestFullscreen();

// --- Cambiar cinta (host) ---
document.getElementById('newVideo')?.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('video', file);
  form.append('hostToken', hostToken);
  const res = await fetch(`/room/${roomId}/change-video`, { method: 'POST', body: form });
  const data = await res.json();
  if (data.error) alert(data.error);
});

// --- Chat ---
const messages = document.getElementById('messages');
function addMessage(html, cls) {
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = html;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
socket.on('chat-message', (data) => {
  if (data.system) addMessage(data.text, 'system');
  else addMessage(`<span class="msg"><b>${data.user}:</b> ${data.text}</span>`, 'msg');
});

const chatInput = document.getElementById('chatInput');
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && chatInput.value.trim()) {
    socket.emit('chat-message', chatInput.value.trim());
    chatInput.value = '';
  }
});

// --- Reacciones ---
document.querySelectorAll('.reactions button').forEach(btn => {
  btn.onclick = () => socket.emit('reaction', btn.dataset.e);
});
socket.on('reaction', (emoji) => {
  const el = document.createElement('div');
  el.className = 'float-emoji';
  el.textContent = emoji;
  el.style.left = Math.random() * 80 + '%';
  document.querySelector('.screen-wrap').appendChild(el);
  setTimeout(() => el.remove(), 2500);
});
</script>
</body>
</html>
