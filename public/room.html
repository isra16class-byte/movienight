<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MovieNight - Sala</title>
<script src="/socket.io/socket.io.js"></script>
<style>
  * { box-sizing: border-box; }
  body { margin:0; background:#0d0d14; color:#eee; font-family:'Segoe UI', sans-serif; display:flex; height:100vh; }
  .main { flex:1; display:flex; flex-direction:column; position:relative; }
  video { width:100%; height:100%; background:black; }
  .side { width:300px; background:#16161f; display:flex; flex-direction:column; border-left:1px solid #2a2a35; }
  .tabs { display:flex; border-bottom:1px solid #2a2a35; }
  .tabs button { flex:1; background:none; border:none; color:#888; padding:10px; cursor:pointer; }
  .tabs button.active { color:#ff2e88; border-bottom:2px solid #ff2e88; }
  .panel { flex:1; overflow-y:auto; display:none; }
  .panel.active { display:flex; flex-direction:column; }
  #messages { flex:1; overflow-y:auto; padding:10px; font-size:14px; }
  #messages .system { color:#888; font-style:italic; margin:4px 0; }
  #messages .msg b { color:#ff2e88; }
  .chat-input { display:flex; padding:8px; border-top:1px solid #2a2a35; }
  .chat-input input { flex:1; background:#0d0d14; border:1px solid #333; color:white; padding:8px; border-radius:6px; }
  .reactions { display:flex; gap:6px; padding:8px; border-top:1px solid #2a2a35; flex-wrap:wrap; }
  .reactions button { background:#22222e; border:none; font-size:20px; padding:6px 10px; border-radius:8px; cursor:pointer; }
  .float-emoji { position:absolute; bottom:60px; font-size:32px; animation: floatUp 2.5s ease-out forwards; pointer-events:none; }
  @keyframes floatUp { 0%{ opacity:1; transform:translateY(0);} 100%{ opacity:0; transform:translateY(-300px);} }
  .viewers-badge { position:absolute; top:10px; right:10px; background:rgba(0,0,0,0.6); padding:6px 12px; border-radius:20px; font-size:13px; z-index:5; }
  .host-badge { position:absolute; top:10px; left:10px; background:rgba(255,46,136,0.85); padding:6px 12px; border-radius:20px; font-size:13px; z-index:5; }
  .viewer-item { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-bottom:1px solid #22222e; font-size:13px; }
  .viewer-item .actions button { background:#22222e; border:none; color:#eee; padding:4px 8px; border-radius:6px; margin-left:4px; cursor:pointer; font-size:12px; }
  .viewer-item .actions button.kick { color:#ff5b5b; }
  .viewer-item .actions button.muted { color:#ffcc00; }
  .change-video { padding:10px; border-top:1px solid #2a2a35; }
  .change-video label { display:block; background:#ff2e88; text-align:center; padding:8px; border-radius:8px; cursor:pointer; font-size:13px; }
  .change-video input { display:none; }
  .local-controls { position:absolute; bottom:10px; right:10px; background:rgba(0,0,0,0.6); padding:8px 12px; border-radius:10px; display:flex; gap:10px; align-items:center; z-index:5; }
  .muted-banner { position:absolute; bottom:10px; left:10px; background:rgba(255,80,80,0.85); padding:6px 12px; border-radius:8px; font-size:12px; z-index:5; }
</style>
</head>
<body>
<div class="main">
  <div class="viewers-badge" id="viewers">👥 0</div>
  <div class="host-badge" id="hostBadge" style="display:none;">👑 Eres el host</div>
  <video id="player" playsinline webkit-playsinline disablepictureinpicture></video>
  <div class="local-controls" id="localControls" style="display:none;">
    <span>🔊</span><input type="range" id="volSlider" min="0" max="1" step="0.05" value="1">
    <button id="fsBtn" style="background:#22222e;color:#eee;border:none;padding:4px 8px;border-radius:6px;cursor:pointer;">⛶</button>
  </div>
  <div class="muted-banner" id="mutedBanner" style="display:none;">🔇 El host te silenció el chat</div>
</div>

<div class="side">
  <div class="tabs">
    <button class="active" data-tab="chat">Chat</button>
    <button data-tab="people">Espectadores</button>
  </div>

  <div class="panel active" id="panel-chat">
    <div id="messages"></div>
    <div class="reactions">
      <button data-e="😂">😂</button>
      <button data-e="🔥">🔥</button>
      <button data-e="😱">😱</button>
      <button data-e="❤️">❤️</button>
      <button data-e="👏">👏</button>
    </div>
    <div class="chat-input">
      <input id="chatInput" placeholder="Escribe algo...">
    </div>
  </div>

  <div class="panel" id="panel-people">
    <div id="viewerList"></div>
    <div class="change-video" id="changeVideoWrap" style="display:none;">
      <label for="newVideo">🎞️ Cambiar película</label>
      <input type="file" id="newVideo" accept="video/*">
    </div>
  </div>
</div>

<script>
const roomId = location.pathname.split('/').pop();
const username = prompt('¿Cómo te llamas?') || 'Anónimo';
const hostToken = localStorage.getItem('mn_host_' + roomId) || null;
const socket = io();
const player = document.getElementById('player');
let isHost = false;
let ignoreSync = false;
let myId = null;
let lastKnownTime = 0;

fetch(`/api/room/${roomId}`).then(r => r.json()).then(data => {
  if (data.error) { alert('Sala no encontrada'); return; }
  player.src = data.videoFile;
});

socket.on('connect', () => { myId = socket.id; });
socket.emit('join-room', { roomId, username, hostToken });
socket.on('room-error', msg => { alert(msg); location.href = '/'; });

socket.on('host-status', (host) => {
  isHost = host;
  player.controls = isHost;
  document.getElementById('hostBadge').style.display = isHost ? 'block' : 'none';
  document.getElementById('localControls').style.display = isHost ? 'none' : 'flex';
  document.getElementById('changeVideoWrap').style.display = isHost ? 'block' : 'none';
});

socket.on('viewer-count', n => document.getElementById('viewers').textContent = `👥 ${n}`);

socket.on('kicked', () => { alert('El host te expulsó de la sala 🚪'); location.href = '/'; });
socket.on('mute-status', ({ muted }) => {
  document.getElementById('mutedBanner').style.display = muted ? 'block' : 'none';
  document.getElementById('chatInput').disabled = muted;
});

// --- Lista de espectadores (solo el host ve botones) ---
socket.on('viewer-list', (list) => {
  const el = document.getElementById('viewerList');
  el.innerHTML = '';
  list.forEach(v => {
    const row = document.createElement('div');
    row.className = 'viewer-item';
    let actions = '';
    if (isHost && v.id !== myId && !v.isHost) {
      actions = `<span class="actions">
        <button class="mute" data-id="${v.id}">${v.muted ? 'Desilenciar' : 'Silenciar'}</button>
        <button class="kick" data-id="${v.id}">Expulsar</button>
      </span>`;
    }
    row.innerHTML = `<span>${v.isHost ? '👑 ' : ''}${v.username}${v.muted ? ' 🔇' : ''}</span>${actions}`;
    el.appendChild(row);
  });
  el.querySelectorAll('.mute').forEach(b => b.onclick = () => socket.emit('toggle-mute', b.dataset.id));
  el.querySelectorAll('.kick').forEach(b => b.onclick = () => { if (confirm('¿Expulsar a este usuario?')) socket.emit('kick-user', b.dataset.id); });
});

// --- Tabs ---
document.querySelectorAll('.tabs button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  };
});

// --- Sincronización (solo se emite si soy host) ---
player.addEventListener('play', () => { if (isHost && !ignoreSync) socket.emit('sync', { type: 'play', time: player.currentTime }); });
player.addEventListener('pause', () => { if (isHost && !ignoreSync) socket.emit('sync', { type: 'pause', time: player.currentTime }); });
player.addEventListener('seeked', () => { if (isHost && !ignoreSync) socket.emit('sync', { type: 'seek', time: player.currentTime }); });

socket.on('sync', (data) => {
  if (data.type === 'heartbeat') {
    if (Math.abs(player.currentTime - data.time) > 1.5) {
      ignoreSync = true;
      player.currentTime = data.time;
      setTimeout(() => ignoreSync = false, 300);
    }
    if (data.paused && !player.paused) { ignoreSync = true; player.pause(); setTimeout(() => ignoreSync = false, 300); }
    if (!data.paused && player.paused) { ignoreSync = true; player.play(); setTimeout(() => ignoreSync = false, 300); }
    lastKnownTime = data.time;
    return;
  }
  ignoreSync = true;
  if (Math.abs(player.currentTime - data.time) > 1) player.currentTime = data.time;
  if (data.type === 'play') player.play();
  if (data.type === 'pause') player.pause();
  lastKnownTime = data.time;
  setTimeout(() => ignoreSync = false, 300);
});

// El host manda su posición cada 4s para corregir cualquier desvío
setInterval(() => {
  if (isHost) socket.emit('sync', { type: 'heartbeat', time: player.currentTime, paused: player.paused });
}, 4000);

// Bloquea cualquier intento de adelantar/atrasar manual en los no-host
player.addEventListener('timeupdate', () => {
  if (!isHost && !ignoreSync) lastKnownTime = player.currentTime;
});
player.addEventListener('seeking', () => {
  if (!isHost && !ignoreSync) {
    ignoreSync = true;
    player.currentTime = lastKnownTime;
    setTimeout(() => ignoreSync = false, 200);
  }
});

socket.on('video-changed', ({ videoFile }) => {
  player.src = videoFile;
  player.load();
});

// --- Controles locales (no-host): volumen y pantalla completa ---
document.getElementById('volSlider').addEventListener('input', (e) => player.volume = e.target.value);
document.getElementById('fsBtn').onclick = () => player.requestFullscreen();

// --- Cambiar película (host) ---
document.getElementById('newVideo')?.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  const form = new FormData();
  form.append('video', file);
  form.append('hostToken', hostToken);
  const res = await fetch(`/room/${roomId}/change-video`, { method: 'POST', body: form });
  const data = await res.json();
  if (data.error) alert(data.error);
});

// --- Chat ---
const messages = document.getElementById('messages');
function addMessage(html, cls) {
  const div = document.createElement('div');
  div.className = cls;
  div.innerHTML = html;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}
socket.on('chat-message', (data) => {
  if (data.system) addMessage(data.text, 'system');
  else addMessage(`<span class="msg"><b>${data.user}:</b> ${data.text}</span>`, 'msg');
});

const chatInput = document.getElementById('chatInput');
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && chatInput.value.trim()) {
    socket.emit('chat-message', chatInput.value.trim());
    chatInput.value = '';
  }
});

// --- Reacciones ---
document.querySelectorAll('.reactions button').forEach(btn => {
  btn.onclick = () => socket.emit('reaction', btn.dataset.e);
});
socket.on('reaction', (emoji) => {
  const el = document.createElement('div');
  el.className = 'float-emoji';
  el.textContent = emoji;
  el.style.left = Math.random() * 80 + '%';
  document.querySelector('.main').appendChild(el);
  setTimeout(() => el.remove(), 2500);
});
</script>
</body>
</html>
